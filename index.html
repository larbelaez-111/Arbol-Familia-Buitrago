<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico - Familia Buitrago</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --azul: #4a7fb5;
    --rosa: #c9648a;
    --gris: #8a8a8a;
    --fondo: #f7f6f3;
    --linea: #b9b2a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: #2b2b2b;
  }
  header {
    background: #2f3b4c;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    position: relative;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    white-space: nowrap;
  }
  header .sep { flex: 1; }
  header input[type="text"] {
    padding: 7px 10px;
    border-radius: 6px;
    border: none;
    width: 220px;
    font-size: 14px;
  }
  header button {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    background: var(--azul);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  header button:hover { filter: brightness(1.1); }
  #estado {
    font-size: 12px;
    color: #cfd6e0;
    white-space: nowrap;
  }
  #contenedor {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px);
    overflow: hidden;
  }
  #mensaje {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--gris);
    font-size: 15px;
    max-width: 480px;
  }
  #mensaje.error { color: #a33; }
  svg { width: 100%; height: 100%; display: block; }
  .enlace {
    fill: none;
    stroke: var(--linea);
    stroke-width: 1.6px;
  }
  .nodo circle {
    stroke-width: 2px;
    cursor: pointer;
  }
  .nodo.M circle { fill: var(--azul); stroke: #2f5a86; }
  .nodo.F circle { fill: var(--rosa); stroke: #8f3f5e; }
  .nodo.otro circle { fill: var(--gris); stroke: #5c5c5c; }
  .nodo text {
    font-size: 12px;
    fill: #2b2b2b;
  }
  .nodo .anio {
    font-size: 10px;
    fill: #6b6b6b;
  }
  .nodo.resaltado circle {
    stroke: #e0a800;
    stroke-width: 4px;
  }
  .nodo.atenuado { opacity: 0.15; }
  .leyenda {
    position: absolute;
    bottom: 14px;
    left: 14px;
    background: rgba(255,255,255,.92);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .leyenda span { display: inline-flex; align-items: center; margin-right: 14px; }
  .leyenda i {
    display: inline-block;
    width: 11px; height: 11px;
    border-radius: 50%;
    margin-right: 5px;
  }
</style>
</head>
<body>

<header>
  <h1>🌳 Árbol Genealógico — Familia Buitrago</h1>
  <input id="buscador" type="text" placeholder="Buscar nombre...">
  <button id="btnRefrescar" title="Vuelve a leer el Google Sheet">Actualizar datos</button>
  <button id="btnExpandir" title="Expande todas las ramas">Expandir todo</button>
  <button id="btnColapsar" title="Colapsa a la segunda generación">Colapsar</button>
  <div class="sep"></div>
  <div id="estado">Cargando...</div>
</header>

<div id="contenedor">
  <div id="mensaje">Cargando datos desde Google Sheets...</div>
  <div class="leyenda">
    <span><i style="background:var(--azul)"></i>Hombre</span>
    <span><i style="background:var(--rosa)"></i>Mujer</span>
    <span><i style="background:var(--gris)"></i>Sin dato</span>
  </div>
</div>

<script>
/* =========================================================================
   CONFIGURACIÓN — el único dato que cambia si en algún momento usas otra
   hoja de cálculo o publicas un nuevo tab: pega aquí el link "Publicar en
   la web" (Archivo > Compartir > Publicar en la web > CSV).
   ========================================================================= */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRBwo49JsnhVjq3-4qr2JADxWTOiS2ZholnyzouJwGwHDat6ngyw-N9bO5NcEhsfdf7IlUdPGX8qgTl/pub?gid=0&single=true&output=csv";

const elMensaje = document.getElementById("mensaje");
const elEstado = document.getElementById("estado");
const elBuscador = document.getElementById("buscador");

/* ---------- utilidades de texto ---------- */
function normalizar(s) {
  return (s || "")
    .toString()
    .normalize("NFD").replace(/[̀-ͯ]/g, "") // quita tildes para comparar
    .trim()
    .replace(/\s+/g, " ")
    .toLowerCase();
}

/* ---------- carga y parseo del CSV ---------- */
async function cargarDatos() {
  const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now();
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("El sheet respondió " + res.status + ". Revisa que siga publicado (Archivo > Compartir > Publicar en la web).");
  const csv = await res.text();
  const parsed = Papa.parse(csv.trim(), { header: true, skipEmptyLines: true });
  const filas = parsed.data
    .map(r => ({
      nombre: (r["Nombre"] || "").trim(),
      genero: (r["Genero"] || "").trim().toUpperCase(),
      generacion: (r["Generacion"] || "").trim(),
      papa: (r["Papa"] || "").trim(),
      mama: (r["Mama"] || "").trim(),
      nacimiento: (r["Fecha Nacimiento"] || "").trim(),
      anio: (r["Año"] || "").trim(),
    }))
    .filter(p => p.nombre);
  if (!filas.length) throw new Error("La hoja se leyó pero no se encontraron filas con 'Nombre'. Revisa los encabezados de columna.");
  return filas;
}

/* ---------- arma el árbol a partir de las columnas Papa / Mama ---------- */
function construirArbol(personas) {
  const byNorm = new Map();
  personas.forEach(p => { p.hijos = []; byNorm.set(normalizar(p.nombre), p); });
  const normList = [...byNorm.keys()];

  // Resuelve un nombre de padre/madre contra la lista de personas, tolerando
  // apellidos incompletos o espacios extra (común en captura manual).
  function resolver(nombreRaw) {
    const norm = normalizar(nombreRaw);
    if (!norm) return null;
    if (byNorm.has(norm)) return byNorm.get(norm);
    const candidatos = normList.filter(n => n.startsWith(norm) || norm.startsWith(n));
    if (!candidatos.length) return null;
    candidatos.sort((a, b) => b.length - a.length); // el más específico
    return byNorm.get(candidatos[0]);
  }

  personas.forEach(p => {
    p.padreResuelto = resolver(p.papa) || resolver(p.mama) || null;
  });

  // La generación G1 se funde en una sola "raíz" (la pareja fundadora)
  const g1 = personas.filter(p => p.generacion === "G1");
  let raiz;
  if (g1.length >= 2) {
    raiz = { nombre: g1.map(p => p.nombre).join(" & "), genero: "otro", esRaiz: true, hijos: [] };
    g1.forEach(p => { p.hijos = raiz.hijos; });
  } else if (g1.length === 1) {
    raiz = g1[0];
  } else {
    raiz = { nombre: "Familia Buitrago", genero: "otro", esRaiz: true, hijos: [] };
  }

  const g1Set = new Set(g1);
  const huerfanos = [];
  personas.forEach(p => {
    if (g1Set.has(p)) return;
    if (p.padreResuelto) p.padreResuelto.hijos.push(p);
    else huerfanos.push(p);
  });
  if (huerfanos.length) raiz.hijos.push(...huerfanos);

  return { raiz, huerfanos };
}

/* ---------- render con D3 (árbol colapsable, con zoom/pan) ---------- */
let root, svg, g, treeLayout, zoomBehavior;
const ANCHO_NODO = 190, ALTO_NODO = 70;
let idSeq = 0;

function render(raizData) {
  document.getElementById("contenedor").querySelectorAll("svg").forEach(n => n.remove());

  const contenedor = document.getElementById("contenedor");
  const ancho = contenedor.clientWidth, alto = contenedor.clientHeight;

  svg = d3.select("#contenedor").append("svg");
  g = svg.append("g").attr("transform", "translate(80,40)");

  zoomBehavior = d3.zoom().scaleExtent([0.2, 2.5]).on("zoom", (ev) => {
    g.attr("transform", ev.transform);
  });
  svg.call(zoomBehavior).call(zoomBehavior.transform, d3.zoomIdentity.translate(80, 40).scale(0.85));

  root = d3.hierarchy(raizData, d => d.hijos);
  root.x0 = 0;
  root.y0 = 0;
  root.each(d => { d.id = ++idSeq; });

  // Colapsa a partir de la 3a generación visible para que el primer
  // vistazo no sature la pantalla.
  root.each(d => {
    if (d.depth >= 2 && d.children) {
      d._children = d.children;
      d.children = null;
    }
  });

  treeLayout = d3.tree().nodeSize([ALTO_NODO, ANCHO_NODO]);
  actualizar(root);
}

function actualizar(fuente) {
  treeLayout(root);

  const nodos = root.descendants();
  const enlaces = root.links();

  // --- enlaces ---
  const linkSel = g.selectAll("path.enlace").data(enlaces, d => d.target.id);
  linkSel.enter().append("path").attr("class", "enlace")
    .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x))
    .merge(linkSel)
    .transition().duration(300)
    .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));
  linkSel.exit().remove();

  // --- nodos ---
  const nodoSel = g.selectAll("g.nodo").data(nodos, d => d.id);

  const nodoEnter = nodoSel.enter().append("g")
    .attr("class", d => "nodo " + claseGenero(d.data))
    .attr("transform", d => "translate(" + fuente.y0 + "," + fuente.x0 + ")")
    .on("click", (ev, d) => {
      if (d.children) { d._children = d.children; d.children = null; }
      else { d.children = d._children; d._children = null; }
      actualizar(d);
    });

  nodoEnter.append("circle").attr("r", 1e-6);
  nodoEnter.append("text")
    .attr("dy", "-0.6em")
    .attr("x", d => (d.children || d._children) ? -14 : 14)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
    .text(d => d.data.nombre);
  nodoEnter.append("text")
    .attr("class", "anio")
    .attr("dy", "1em")
    .attr("x", d => (d.children || d._children) ? -14 : 14)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
    .text(d => d.data.anio ? "(" + d.data.anio + ")" : (d.data.generacion || ""));

  const nodoUpdate = nodoEnter.merge(nodoSel);
  nodoUpdate.transition().duration(300)
    .attr("transform", d => "translate(" + d.y + "," + d.x + ")");
  nodoUpdate.select("circle")
    .attr("r", d => d.data.esRaiz ? 9 : 6.5)
    .style("fill-opacity", d => d._children ? 1 : (d.children ? 1 : 0.85));

  const nodoExit = nodoSel.exit().transition().duration(300)
    .attr("transform", d => "translate(" + fuente.y + "," + fuente.x + ")")
    .remove();
  nodoExit.select("circle").attr("r", 1e-6);

  nodos.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function claseGenero(d) {
  if (d.genero === "M") return "M";
  if (d.genero === "F") return "F";
  return "otro";
}

/* ---------- expandir / colapsar todo ---------- */
function expandirTodo() {
  root.each(d => { if (d._children) { d.children = d._children; d._children = null; } });
  actualizar(root);
}
function colapsarADosNiveles() {
  root.each(d => {
    if (d.depth >= 2 && d.children) { d._children = d.children; d.children = null; }
    if (d.depth < 2 && d._children) { d.children = d._children; d._children = null; }
  });
  actualizar(root);
}

/* ---------- búsqueda ---------- */
function buscar(termino) {
  const norm = normalizar(termino);
  g.selectAll("g.nodo").classed("resaltado", false).classed("atenuado", false);
  if (!norm) return;

  // abre ramas necesarias para revelar coincidencias colapsadas
  let cambio = false;
  root.each(d => {
    if (normalizar(d.data.nombre).includes(norm) && d._children) {
      d.children = d._children; d._children = null; cambio = true;
    }
  });
  if (cambio) actualizar(root);

  const coincide = d => normalizar(d.data.nombre).includes(norm);
  g.selectAll("g.nodo")
    .classed("resaltado", d => coincide(d))
    .classed("atenuado", d => !coincide(d));
}

/* ---------- arranque ---------- */
async function iniciar() {
  try {
    elEstado.textContent = "Cargando...";
    const personas = await cargarDatos();
    const { raiz, huerfanos } = construirArbol(personas);
    elMensaje.style.display = "none";
    render(raiz);
    const hora = new Date().toLocaleString("es-CO", { hour12: false });
    elEstado.textContent = personas.length + " personas · actualizado " + hora +
      (huerfanos.length ? " · " + huerfanos.length + " sin padre reconocido" : "");
  } catch (err) {
    elMensaje.textContent = "No se pudo cargar el árbol: " + err.message;
    elMensaje.classList.add("error");
    elMensaje.style.display = "block";
    elEstado.textContent = "Error";
    console.error(err);
  }
}

document.getElementById("btnRefrescar").addEventListener("click", iniciar);
document.getElementById("btnExpandir").addEventListener("click", () => root && expandirTodo());
document.getElementById("btnColapsar").addEventListener("click", () => root && colapsarADosNiveles());
elBuscador.addEventListener("input", (e) => root && buscar(e.target.value));
window.addEventListener("resize", () => root && render(root.data));

iniciar();
</script>
</body>
</html>
