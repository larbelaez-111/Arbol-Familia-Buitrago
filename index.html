<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico - Familia Buitrago</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --azul: #4a7fb5;
    --rosa: #c9648a;
    --gris: #8a8a8a;
    --fondo: #f7f6f3;
    --linea: #c7c0b2;
    --hover: #eef2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: #2b2b2b;
  }
  header {
    background: #2f3b4c;
    color: #fff;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    position: relative;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    white-space: nowrap;
  }
  header .sep { flex: 1; }
  header input[type="text"] {
    padding: 7px 10px;
    border-radius: 6px;
    border: none;
    width: 220px;
    font-size: 14px;
  }
  header button {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    background: var(--azul);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  header button:hover { filter: brightness(1.1); }
  #estado {
    font-size: 12px;
    color: #cfd6e0;
    white-space: nowrap;
  }
  #contenedor {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px);
    overflow: auto;
    background: #fff;
  }
  #mensaje {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--gris);
    font-size: 15px;
    max-width: 480px;
  }
  #mensaje.error { color: #a33; }

  /* ---------- estilo "explorador de Windows" ---------- */
  #arbol {
    padding: 18px 24px 80px 18px;
    font-size: 14px;
    line-height: 1.9;
    user-select: none;
  }
  .nodo-wrapper { position: relative; }
  .fila-nodo {
    display: flex;
    align-items: center;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .fila-nodo:hover { background: var(--hover); }
  .fila-nodo.raiz .texto { font-weight: 700; font-size: 15px; }
  .toggle {
    display: inline-block;
    width: 16px;
    text-align: center;
    color: #555;
    font-size: 11px;
    flex: none;
  }
  .toggle.sin-hijos { color: #c9c2b3; font-size: 8px; }
  .punto {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin: 0 8px 0 4px;
    flex: none;
  }
  .punto.M { background: var(--azul); }
  .punto.F { background: var(--rosa); }
  .punto.otro { background: var(--gris); }
  .texto { color: #2b2b2b; }
  .fila-nodo.resaltado { background: #fff3b0; }
  .fila-nodo.atenuado { opacity: .28; }
  .info-icono {
    margin-left: 8px;
    color: #7a8ba3;
    cursor: pointer;
    font-size: 12px;
  }
  .info-icono.abierto { color: #2f5a86; font-weight: 700; }
  .detalle {
    margin: 2px 0 6px 34px;
    padding: 8px 12px;
    font-size: 12.5px;
    color: #444;
    background: #f7f7f5;
    border-left: 3px solid var(--linea);
    border-radius: 0 6px 6px 0;
    max-width: 480px;
  }
  .ficha-persona { margin-bottom: 6px; }
  .ficha-nombre {
    font-weight: 700;
    color: #2f3b4c;
    margin: 6px 0 2px;
  }
  .ficha-nombre:first-child { margin-top: 0; }
  .linea-ficha { padding: 1px 0; }
  .linea-ficha.vacio { color: #999; font-style: italic; }
  .etiqueta-ficha { font-weight: 600; color: #666; }
  .hijos {
    margin-left: 8px;
    padding-left: 15px;
    border-left: 1px dashed var(--linea);
  }
  .leyenda {
    position: fixed;
    bottom: 14px;
    left: 14px;
    background: rgba(255,255,255,.94);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
    z-index: 5;
  }
  .leyenda span { display: inline-flex; align-items: center; margin-right: 14px; }
  .leyenda i {
    display: inline-block;
    width: 11px; height: 11px;
    border-radius: 50%;
    margin-right: 5px;
  }

  /* ---------- panel de filtros ---------- */
  .panel-filtros {
    position: absolute;
    top: 100%;
    right: 20px;
    background: #fff;
    color: #2b2b2b;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
    padding: 12px 16px;
    z-index: 20;
    display: none;
    min-width: 190px;
    font-size: 13px;
  }
  .panel-filtros.abierto { display: block; }
  .opcion-filtro {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 5px 0;
    cursor: pointer;
  }
  .divisor-filtro {
    font-weight: 600;
    margin-top: 10px;
    margin-bottom: 4px;
    font-size: 12px;
    color: #555;
    border-top: 1px solid #eee;
    padding-top: 8px;
  }
  .mini-btn {
    margin-top: 8px;
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid #ccc;
    background: #f2f2f2;
    color: #333;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🌳 Árbol Genealógico — Familia Buitrago</h1>
  <input id="buscador" type="text" placeholder="Buscar nombre...">
  <button id="btnRefrescar" title="Vuelve a leer el Google Sheet">Actualizar datos</button>
  <button id="btnExpandir" title="Expande todas las ramas">Expandir todo</button>
  <button id="btnColapsar" title="Colapsa a la segunda generación">Colapsar</button>
  <button id="btnFiltros" title="Cónyuges y generaciones">Filtros ▾</button>
  <div class="sep"></div>
  <div id="estado">Cargando...</div>
  <div class="panel-filtros" id="panelFiltros"></div>
</header>

<div id="contenedor">
  <div id="mensaje">Cargando datos desde Google Sheets...</div>
  <div id="arbol"></div>
  <div class="leyenda">
    <span><i style="background:var(--azul)"></i>Hombre</span>
    <span><i style="background:var(--rosa)"></i>Mujer</span>
    <span><i style="background:var(--gris)"></i>Sin dato</span>
  </div>
</div>

<script>
/* =========================================================================
   CONFIGURACIÓN — el único dato que cambia si en algún momento usas otra
   hoja de cálculo o publicas un nuevo tab: pega aquí el link "Publicar en
   la web" (Archivo > Compartir > Publicar en la web > CSV).
   ========================================================================= */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRBwo49JsnhVjq3-4qr2JADxWTOiS2ZholnyzouJwGwHDat6ngyw-N9bO5NcEhsfdf7IlUdPGX8qgTl/pub?gid=0&single=true&output=csv";

const elMensaje = document.getElementById("mensaje");
const elEstado = document.getElementById("estado");
const elBuscador = document.getElementById("buscador");
const elArbol = document.getElementById("arbol");

/* ---------- utilidades de texto ---------- */
function normalizar(s) {
  return (s || "")
    .toString()
    .normalize("NFD").replace(/[̀-ͯ]/g, "") // quita tildes para comparar
    .trim()
    .replace(/\s+/g, " ")
    .toLowerCase();
}

/* ---------- carga y parseo del CSV ---------- */
async function cargarDatos() {
  const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now();
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("El sheet respondió " + res.status + ". Revisa que siga publicado (Archivo > Compartir > Publicar en la web).");
  const csv = await res.text();
  const parsed = Papa.parse(csv.trim(), { header: true, skipEmptyLines: true });
  const filas = parsed.data
    .map(r => ({
      nombre: (r["Nombre"] || "").trim(),
      genero: (r["Genero"] || "").trim().toUpperCase(),
      generacion: (r["Generacion"] || "").trim(),
      papa: (r["Papa"] || "").trim(),
      mama: (r["Mama"] || "").trim(),
      nacimiento: (r["Fecha Nacimiento"] || "").trim(),
      anio: (r["Año"] || "").trim(),
      conyuge: (r["Pareja"] || r["Conyuge"] || r["Cónyuge"] || "").trim(),
      profesion: (r["Profesion"] || r["Profesión"] || "").trim(),
      lugarNacimiento: (r["Lugar Nacimiento"] || r["Lugar de Nacimiento"] || "").trim(),
      ubicacionActual: (r["Reside Actualmente"] || r["Ubicacion Actual"] || r["Ubicación Actual"] || "").trim(),
      edad: (r["Edad"] || "").trim(),
      fallecimiento: (r["Fallecimiento"] || "").trim(),
    }))
    .filter(p => p.nombre);
  if (!filas.length) throw new Error("La hoja se leyó pero no se encontraron filas con 'Nombre'. Revisa los encabezados de columna.");
  return filas;
}

/* ---------- edad calculada a partir de "Fecha Nacimiento" (dd/mm/aaaa) ---------- */
function parseFechaDMY(s) {
  if (!s) return null;
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (!m) return null;
  const dia = parseInt(m[1], 10), mes = parseInt(m[2], 10), anio = parseInt(m[3], 10);
  const d = new Date(anio, mes - 1, dia);
  return isNaN(d.getTime()) ? null : d;
}
function calcularEdad(fechaStr) {
  const d = parseFechaDMY(fechaStr);
  if (!d) return null;
  const hoy = new Date();
  let edad = hoy.getFullYear() - d.getFullYear();
  const m = hoy.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && hoy.getDate() < d.getDate())) edad--;
  return edad;
}

/* ---------- arma el árbol a partir de las columnas Papa / Mama ---------- */
function construirArbol(personas) {
  const byNorm = new Map();
  personas.forEach(p => { p.hijos = []; byNorm.set(normalizar(p.nombre), p); });
  const normList = [...byNorm.keys()];

  // Resuelve un nombre de padre/madre contra la lista de personas, tolerando
  // apellidos incompletos o espacios extra (común en captura manual).
  function resolver(nombreRaw) {
    const norm = normalizar(nombreRaw);
    if (!norm) return null;
    if (byNorm.has(norm)) return byNorm.get(norm);
    const candidatos = normList.filter(n => n.startsWith(norm) || norm.startsWith(n));
    if (!candidatos.length) return null;
    candidatos.sort((a, b) => b.length - a.length); // el más específico
    return byNorm.get(candidatos[0]);
  }

  personas.forEach(p => {
    p.padreResuelto = resolver(p.papa) || resolver(p.mama) || null;
  });

  // La generación G1 se funde en una sola "raíz" (la pareja fundadora)
  const g1 = personas.filter(p => p.generacion === "G1");
  let raiz;
  if (g1.length >= 2) {
    raiz = {
      nombre: g1.map(p => p.nombre + (p.anio ? " (" + p.anio + ")" : "")).join(" & "),
      genero: "otro",
      esRaiz: true,
      hijos: [],
      integrantes: g1, // para mostrar la ficha técnica de cada fundador por separado
    };
    g1.forEach(p => { p.hijos = raiz.hijos; });
  } else if (g1.length === 1) {
    raiz = g1[0];
    raiz.esRaiz = true;
  } else {
    raiz = { nombre: "Familia Buitrago", genero: "otro", esRaiz: true, hijos: [] };
  }

  const g1Set = new Set(g1);
  const huerfanos = [];
  personas.forEach(p => {
    if (g1Set.has(p)) return;
    if (p.padreResuelto) p.padreResuelto.hijos.push(p);
    else huerfanos.push(p);
  });
  if (huerfanos.length) raiz.hijos.push(...huerfanos);

  return { raiz, huerfanos };
}

/* ---------- estado del árbol en memoria ---------- */
let raizGlobal = null;
let idSeq = 0;
let idMap = new Map();
let mostrarConyuges = false;
let filtroGeneraciones = null; // Set con las generaciones activas; null = sin filtro (todas)

function generacionesDisponibles() {
  const set = new Set();
  (function rec(n) {
    if (n.generacion) set.add(n.generacion);
    (n.hijos || []).forEach(rec);
  })(raizGlobal);
  return [...set].sort();
}

function actualizarFiltroGeneracion() {
  (function marcar(n) {
    n._fueraFiltro = !!(filtroGeneraciones && n.generacion && !filtroGeneraciones.has(n.generacion));
    (n.hijos || []).forEach(marcar);
  })(raizGlobal);
  renderArbol();
}

function construirPanelFiltros() {
  const panel = document.getElementById("panelFiltros");
  panel.innerHTML = "";

  const filaConyuge = document.createElement("label");
  filaConyuge.className = "opcion-filtro";
  const chkConyuge = document.createElement("input");
  chkConyuge.type = "checkbox";
  chkConyuge.checked = mostrarConyuges;
  chkConyuge.addEventListener("change", () => {
    mostrarConyuges = chkConyuge.checked;
    renderArbol();
  });
  filaConyuge.appendChild(chkConyuge);
  filaConyuge.appendChild(document.createTextNode(" Mostrar cónyuges"));
  panel.appendChild(filaConyuge);

  const divisor = document.createElement("div");
  divisor.className = "divisor-filtro";
  divisor.textContent = "Generaciones";
  panel.appendChild(divisor);

  const gens = generacionesDisponibles();
  filtroGeneraciones = new Set(gens); // por defecto, todas activas (sin atenuar nada)

  const checks = [];
  gens.forEach(g => {
    const lbl = document.createElement("label");
    lbl.className = "opcion-filtro";
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = true;
    chk.addEventListener("change", () => {
      if (chk.checked) filtroGeneraciones.add(g); else filtroGeneraciones.delete(g);
      actualizarFiltroGeneracion();
    });
    checks.push(chk);
    lbl.appendChild(chk);
    lbl.appendChild(document.createTextNode(" " + g));
    panel.appendChild(lbl);
  });

  const btnTodas = document.createElement("button");
  btnTodas.className = "mini-btn";
  btnTodas.textContent = "Marcar todas";
  btnTodas.addEventListener("click", () => {
    checks.forEach(c => { c.checked = true; });
    filtroGeneraciones = new Set(gens);
    actualizarFiltroGeneracion();
  });
  panel.appendChild(btnTodas);
}

function etiquetarIds(nodo) {
  nodo._id = ++idSeq;
  idMap.set(nodo._id, nodo);
  (nodo.hijos || []).forEach(etiquetarIds);
}

function fijarExpansionInicial(nodo, prof) {
  nodo._expanded = prof < 2; // raíz y 2a generación abiertas, resto colapsado
  (nodo.hijos || []).forEach(h => fijarExpansionInicial(h, prof + 1));
}

function claseGenero(d) {
  if (d.genero === "M") return "M";
  if (d.genero === "F") return "F";
  return "otro";
}

/* ---------- render estilo "explorador de archivos" ---------- */
function crearFila(nodo) {
  const fila = document.createElement("div");
  fila.className = "fila-nodo"
    + (nodo.esRaiz ? " raiz" : "")
    + (nodo._match ? " resaltado" : "")
    + (nodo._fueraFiltro ? " atenuado" : "");
  fila.dataset.id = nodo._id;

  const tieneHijos = !!(nodo.hijos && nodo.hijos.length);

  const toggle = document.createElement("span");
  toggle.className = "toggle" + (tieneHijos ? "" : " sin-hijos");
  toggle.textContent = tieneHijos ? (nodo._expanded ? "▾" : "▸") : "●";
  if (tieneHijos) {
    toggle.style.cursor = "pointer";
    toggle.addEventListener("click", (e) => {
      e.stopPropagation();
      nodo._expanded = !nodo._expanded;
      renderArbol();
    });
  }
  fila.appendChild(toggle);

  const punto = document.createElement("span");
  punto.className = "punto " + claseGenero(nodo);
  fila.appendChild(punto);

  const texto = document.createElement("span");
  texto.className = "texto";
  let sufijo = "";
  if (nodo.anio) sufijo = "  (" + nodo.anio + ")";
  else if (nodo.generacion) sufijo = "  [" + nodo.generacion + "]";
  if (mostrarConyuges && nodo.conyuge) sufijo += "  ⚭ " + nodo.conyuge;
  texto.textContent = nodo.nombre + sufijo;
  fila.appendChild(texto);

  const info = document.createElement("span");
  info.className = "info-icono" + (nodo._detalleAbierto ? " abierto" : "");
  info.textContent = "ⓘ";
  info.title = "Ver ficha técnica";
  info.addEventListener("click", (e) => {
    e.stopPropagation();
    nodo._detalleAbierto = !nodo._detalleAbierto;
    renderArbol();
  });
  fila.appendChild(info);

  if (tieneHijos) {
    fila.style.cursor = "pointer";
    fila.addEventListener("click", () => {
      nodo._expanded = !nodo._expanded;
      renderArbol();
    });
  }
  return fila;
}

function crearLineaFicha(etiqueta, valor) {
  const linea = document.createElement("div");
  linea.className = "linea-ficha";
  const et = document.createElement("span");
  et.className = "etiqueta-ficha";
  et.textContent = etiqueta + ": ";
  linea.appendChild(et);
  linea.appendChild(document.createTextNode(valor));
  return linea;
}

function construirFichaPersona(p) {
  const cont = document.createElement("div");
  cont.className = "ficha-persona";

  // Se usa la columna "Edad" del sheet si existe; si no, se calcula desde la
  // fecha de nacimiento como respaldo.
  const edadCalc = calcularEdad(p.nacimiento);
  const edadTexto = p.edad || (edadCalc !== null ? String(edadCalc) : "");

  const campos = [
    ["Papá", p.papa],
    ["Mamá", p.mama],
    ["Fecha de nacimiento", p.nacimiento],
  ];

  if (p.fallecimiento) {
    // Solo para fallecidos: fecha de fallecimiento + edad entre paréntesis
    campos.push(["Fallecimiento", p.fallecimiento + (edadTexto ? " (" + edadTexto + " años)" : "")]);
  } else {
    campos.push(["Edad", edadTexto ? (edadTexto + " años") : ""]);
  }

  campos.push(
    ["Lugar de nacimiento", p.lugarNacimiento],
    ["Pareja", p.conyuge],
    ["Profesión", p.profesion],
    ["Reside actualmente", p.ubicacionActual]
  );
  let algo = false;
  campos.forEach(([et, val]) => {
    if (val) { cont.appendChild(crearLineaFicha(et, val)); algo = true; }
  });
  if (!algo) {
    const vacio = document.createElement("div");
    vacio.className = "linea-ficha vacio";
    vacio.textContent = "Sin datos adicionales registrados.";
    cont.appendChild(vacio);
  }
  return cont;
}

function crearDetalle(nodo) {
  const det = document.createElement("div");
  det.className = "detalle";
  if (nodo.esRaiz && nodo.integrantes && nodo.integrantes.length) {
    nodo.integrantes.forEach(p => {
      const encabezado = document.createElement("div");
      encabezado.className = "ficha-nombre";
      encabezado.textContent = p.nombre + (p.anio ? " (" + p.anio + ")" : "");
      det.appendChild(encabezado);
      det.appendChild(construirFichaPersona(p));
    });
  } else {
    det.appendChild(construirFichaPersona(nodo));
  }
  return det;
}

function construirNodoDOM(nodo) {
  const wrapper = document.createElement("div");
  wrapper.className = "nodo-wrapper";
  wrapper.appendChild(crearFila(nodo));
  if (nodo._detalleAbierto) wrapper.appendChild(crearDetalle(nodo));

  if (nodo.hijos && nodo.hijos.length && nodo._expanded) {
    const hijosWrap = document.createElement("div");
    hijosWrap.className = "hijos";
    nodo.hijos.forEach(h => hijosWrap.appendChild(construirNodoDOM(h)));
    wrapper.appendChild(hijosWrap);
  }
  return wrapper;
}

function renderArbol() {
  elArbol.innerHTML = "";
  if (!raizGlobal) return;
  elArbol.appendChild(construirNodoDOM(raizGlobal));
}

/* ---------- expandir / colapsar todo ---------- */
function expandirTodo() {
  (function rec(n) { n._expanded = true; (n.hijos || []).forEach(rec); })(raizGlobal);
  renderArbol();
}
function colapsarADosNiveles() {
  fijarExpansionInicial(raizGlobal, 0);
  renderArbol();
}

/* ---------- búsqueda ---------- */
function buscar(termino) {
  const norm = normalizar(termino);

  // limpia estado de coincidencia previo
  (function limpiar(n) { n._match = false; (n.hijos || []).forEach(limpiar); })(raizGlobal);

  if (!norm) { renderArbol(); return; }

  // marca coincidencias y abre las ramas necesarias para revelarlas
  function marcar(nodo) {
    const propio = normalizar(nodo.nombre).includes(norm);
    let algunDescendiente = false;
    (nodo.hijos || []).forEach(h => { if (marcar(h)) algunDescendiente = true; });
    if (algunDescendiente) nodo._expanded = true;
    nodo._match = propio;
    return propio || algunDescendiente;
  }
  marcar(raizGlobal);
  renderArbol();

  const primerMatch = elArbol.querySelector(".fila-nodo.resaltado");
  if (primerMatch && primerMatch.scrollIntoView) primerMatch.scrollIntoView({ block: "center", behavior: "smooth" });
}

/* ---------- arranque ---------- */
async function iniciar() {
  try {
    elEstado.textContent = "Cargando...";
    const personas = await cargarDatos();
    const { raiz, huerfanos } = construirArbol(personas);

    idSeq = 0;
    idMap = new Map();
    etiquetarIds(raiz);
    fijarExpansionInicial(raiz, 0);
    raizGlobal = raiz;

    construirPanelFiltros();
    elMensaje.style.display = "none";
    renderArbol();

    const hora = new Date().toLocaleString("es-CO", { hour12: false });
    elEstado.textContent = personas.length + " personas · actualizado " + hora +
      (huerfanos.length ? " · " + huerfanos.length + " sin padre reconocido" : "");
  } catch (err) {
    elMensaje.textContent = "No se pudo cargar el árbol: " + err.message;
    elMensaje.classList.add("error");
    elMensaje.style.display = "block";
    elEstado.textContent = "Error";
    console.error(err);
  }
}

document.getElementById("btnRefrescar").addEventListener("click", iniciar);
document.getElementById("btnExpandir").addEventListener("click", () => raizGlobal && expandirTodo());
document.getElementById("btnColapsar").addEventListener("click", () => raizGlobal && colapsarADosNiveles());
elBuscador.addEventListener("input", (e) => raizGlobal && buscar(e.target.value));

const btnFiltros = document.getElementById("btnFiltros");
const panelFiltros = document.getElementById("panelFiltros");
btnFiltros.addEventListener("click", (e) => {
  e.stopPropagation();
  panelFiltros.classList.toggle("abierto");
});
document.addEventListener("click", (e) => {
  if (!panelFiltros.contains(e.target) && e.target !== btnFiltros) {
    panelFiltros.classList.remove("abierto");
  }
});

iniciar();
</script>
</body>
</html>
